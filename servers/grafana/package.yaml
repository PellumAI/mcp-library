schema_version: 1
name: grafana
version: 1.5.1
runtime: native
arch: [amd64]
categories: [observability]
source:
  kind: git
  repo: https://github.com/grafana/mcp-grafana
  # v1.5.1, released 2026-09-17.
  commit: "2a33c72f211560e4ffb39d6b99cad3c3dc2a3f6e"
build:
  lockfile: go.sum
  steps:
    - ["go", "mod", "download"]
    - ["go", "build", "-trimpath", "-ldflags", "-s -w -buildid=", "-o", "out/mcp-grafana", "./cmd/mcp-grafana"]
  stage:
    - { from: out/mcp-grafana, to: bin/mcp-grafana }
    - { from: LICENSE, to: LICENSE }
    - { from: NOTICE, to: NOTICE, optional: true }
vetting:
  vetted_on: "2026-09-23"
  vetted_by: "Galvill, with Claude"
  sources:
    - https://github.com/grafana/mcp-grafana/tree/v1.5.1
    - https://github.com/grafana/mcp-grafana/blob/v1.5.1/cmd/mcp-grafana/main.go
    - https://github.com/grafana/mcp-grafana/blob/v1.5.1/go.mod
  license: Apache-2.0
  egress_rationale: "Dials only the operator's own Grafana, declared as ${grafana_url.host}."
  notes: >-
    stdio is the default transport (-t stdio). The container-era entry used
    MCP_GRAFANA_SERVER_TOKEN as gateway_auth; main.go documents that the
    server-auth token "has no effect on the stdio transport", so gateway_auth
    is null here and the executor listener is the control. A Grafana on a
    non-default port needs an instance egress override, because the
    interpolated rule carries the host only.
