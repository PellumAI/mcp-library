schema_version: 1
name: terraform
version: 1.3.0
runtime: native
arch: [amd64]
categories: [infrastructure]
source:
  kind: git
  repo: https://github.com/hashicorp/terraform-mcp-server
  # v1.3.0, released 2026-08-26.
  commit: "943a44eb28dc58432b34efdf08f7fc846adc446d"
build:
  lockfile: go.sum
  steps:
    - ["go", "mod", "download"]
    - ["go", "build", "-trimpath", "-ldflags", "-s -w -buildid=", "-o", "out/terraform-mcp-server", "./cmd/terraform-mcp-server"]
  stage:
    - { from: out/terraform-mcp-server, to: bin/terraform-mcp-server }
    - { from: LICENSE, to: LICENSE }
vetting:
  vetted_on: "2026-09-23"
  vetted_by: "Galvill, with Claude"
  sources:
    - https://github.com/hashicorp/terraform-mcp-server/tree/v1.3.0
    - https://github.com/hashicorp/terraform-mcp-server/blob/v1.3.0/cmd/terraform-mcp-server/init.go
    - https://github.com/hashicorp/terraform-mcp-server/blob/v1.3.0/pkg/client/tfe_client.go
  license: MPL-2.0
  egress_rationale: "The public Terraform registry for provider and module documentation, and HCP Terraform for workspace tools when a token is set."
  notes: >-
    The stdio subcommand is explicit in the entrypoint. TRANSPORT_MODE,
    TRANSPORT_HOST and TRANSPORT_PORT are gone: they made a container listen
    on a reachable address, and a stdio package has none. TFE_TOKEN is
    optional; without it only the registry tools work. A self-hosted
    Terraform Enterprise needs its host added as an instance egress override,
    because an optional param cannot carry an interpolated egress rule.
    Smoke's dummy TFE_TOKEN makes the server contact app.terraform.io, whose
    client setup succeeds despite the bogus token, so it lists 56 tools, 47
    of them HCP Terraform tools; with that host unreachable it lists only
    the 9 registry tools, so the committed snapshot needs app.terraform.io
    reachable through the smoke proxy.
    MPL-2.0 permits redistributing the built binary with its source
    available, which the pinned commit is.
