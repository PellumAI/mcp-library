name: fixture

# Generates the miniature library MCPGW's contract test consumes, and the
# key-rotation rehearsal beside it, with the pinned build image and the real
# signing path, then verifies both with the pure-Go verifier. MCPGW commits the
# output through make library-fixture-refresh; this workflow proves the
# generator still works on every change to it and offers the trees as an
# artifact for a contributor without pull access to the build image.

on:
  pull_request:
    paths:
      - internal/fixture/**
      - internal/build/**
      - internal/pack/**
      - internal/index/**
      - internal/sign/**
      - cmd/mcplib/**
      - EXECUTOR_TARGET.yaml
      - .github/workflows/fixture.yml
  push:
    branches: [main]
    paths:
      - internal/fixture/**
      - .github/workflows/fixture.yml
  workflow_dispatch:

permissions:
  contents: read
  # Pull the pinned build image from this repository's GHCR package.
  packages: read

jobs:
  fixture:
    name: fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and verify the fixture and the rotation rehearsal
        run: |
          set -euo pipefail
          make fixture
          ./bin/mcplib verify --keys dist/fixture/keys --index dist/fixture/index.json --blobs dist/fixture/blobs/sha256
          ./bin/mcplib verify --keys dist/rotation/keys --index dist/rotation/index.json --blobs dist/rotation/blobs/sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture
          path: |
            dist/fixture/
            dist/rotation/
          if-no-files-found: error
          retention-days: 30
