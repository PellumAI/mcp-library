name: publish

# Build, sign and publish packages and the signed index.
#
#   GHCR through ORAS is the durable, content-addressed mirror: every blob is
#   an OCI artifact tagged sha256-<hex>, and the index sits at index:latest and,
#   on a release, index:<tag>.
#   GitHub Pages is the gateway's library_source: pages.yml deploys the site
#   tree this workflow assembles, serving the contract's static paths.
#
# See docs/PUBLISHING.md.

on:
  push:
    branches: [main]
    paths:
      - servers/**
      - build/**
      - contract/**
      - EXECUTOR_TARGET.yaml
      - keys/**
      - internal/**
      - cmd/**
      - .github/workflows/publish.yml
      - scripts/publish-*.sh
      - scripts/assemble-site.sh
      - scripts/fetch-previous-index.sh
  release:
    types: [published]
  workflow_dispatch:

# The organisation forbids a write default for GITHUB_TOKEN; every job below
# declares exactly what it needs and the workflow grants nothing.
permissions: {}

# Two concurrent publishes would race the index merge.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # The key ids that sign, newest first. During a rotation overlap this has
  # two entries; see docs/KEY-ROTATION.md.
  SIGNING_KEYS: library-v1
  KEY_ID: library-v1

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compute the build matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          make build
          m="$(scripts/publish-matrix.sh "$EVENT" "$BEFORE" "$AFTER")"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          if [ "$m" = '{"include":[]}' ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "build matrix: $m"

  build:
    name: build ${{ matrix.name }} ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the pinned build image from this repository's GHCR package.
      packages: read
      # The keyless Actions-OIDC attestation.
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          make build
          ./bin/mcplib build --server "$NAME" --arch "$ARCH" --out dist

      - name: Sign with the library key
        env:
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          COSIGN_LIBRARY_KEY: ${{ secrets.COSIGN_LIBRARY_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_LIBRARY_PASSWORD }}
        run: |
          set -euo pipefail
          ./bin/mcplib sign --key env://COSIGN_LIBRARY_KEY --key-id "$KEY_ID" \
            --signing-keys "$SIGNING_KEYS" "dist/${NAME}-${ARCH}.tar.gz"

      # Additional evidence for people, never the verification path for
      # machines: an air-gapped gateway has no Fulcio and no Rekor. See
      # docs/PUBLISHING.md for the cosign verify-blob --bundle command.
      - name: Attest the blob through Actions OIDC
        env:
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "dist/${NAME}-${ARCH}.tar.gz.cosign.bundle" \
            "dist/${NAME}-${ARCH}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.name }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.1

      - name: Log in to GHCR with ORAS
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin

      - name: Download every build leg
        if: needs.build.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Fetch the previously published index
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/fetch-previous-index.sh dist/previous-index.json

      - name: Merge, canonicalise and sign the index
        env:
          COSIGN_LIBRARY_KEY: ${{ secrets.COSIGN_LIBRARY_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_LIBRARY_PASSWORD }}
          EVENT: ${{ github.event_name }}
          RELEASED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          make build
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$EVENT" = "release" ] && [ -n "$RELEASED_AT" ]; then at="$RELEASED_AT"; fi
          ./bin/mcplib index \
            --dist dist \
            --servers servers \
            --previous dist/previous-index.json \
            --library pellumai/mcp-library \
            --generated-at "$at" \
            --signing-keys "$SIGNING_KEYS" \
            --out dist/index.json
          ./bin/mcplib sign --key env://COSIGN_LIBRARY_KEY --key-id "$KEY_ID" --index dist/index.json

      # Not ceremony: the pure-Go verifier, over what the cosign CLI just
      # produced, against the committed public key, on the exact bytes about
      # to be published. A changed cosign encoding or a wrong key in the
      # secret fails here, before anything leaves the runner.
      - name: Verify with the pure-Go verifier before anything is published
        run: ./bin/mcplib verify --keys keys --index dist/index.json --dist dist

      - name: Push blobs and the index to GHCR
        env:
          RELEASE: ${{ github.event.release.tag_name }}
        run: ./scripts/publish-blobs.sh dist "$RELEASE"

      - name: Assemble the Pages tree
        run: |
          set -euo pipefail
          ./scripts/assemble-site.sh dist site
          ./bin/mcplib verify --keys keys --index site/index.json --blobs site/blobs/sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index
          path: |
            dist/index.json
            dist/index.json.sig
            dist/index.json.sig.*
          if-no-files-found: error
          retention-days: 30

      # Anonymous pull is an organisation package setting no workflow token
      # can change; README.md names the owner step. Until the repository
      # variable GHCR_PUBLIC is set to true after that flip, this warns; after
      # it, a regression fails the publish.
      - name: Prove the index is anonymously pullable
        env:
          ENFORCE: ${{ vars.GHCR_PUBLIC }}
        run: |
          set -euo pipefail
          tok="$(curl -fsSL 'https://ghcr.io/token?scope=repository:pellumai/mcp-library/index:pull&service=ghcr.io' | sed -nE 's/.*"token":"([^"]+)".*/\1/p' || true)"
          code=000
          if [ -n "$tok" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $tok" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              'https://ghcr.io/v2/pellumai/mcp-library/index/manifests/latest')"
          fi
          if [ "$code" = "200" ]; then
            echo "the index is anonymously pullable from GHCR"
            exit 0
          fi
          msg="anonymous pull of ghcr.io/pellumai/mcp-library/index:latest returned $code; flip the GHCR package visibility to public, see docs/PUBLISHING.md"
          if [ "$ENFORCE" = "true" ]; then echo "$msg" >&2; exit 1; fi
          echo "::warning::$msg"

  release-asset:
    name: release asset
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index
          path: dist

      # Blobs are not attached: they are on GHCR and on Pages, and a release
      # asset would be a third copy with no third reader.
      - name: Attach the index and its signatures to the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ github.event.release.tag_name }}
          ASSET_GLOBS: |
            dist/index.json
            dist/index.json.sig
            dist/index.json.sig.*
        with:
          script: |
            const upload = require('./.github/scripts/upload-release-assets.js')
            await upload({ github, context, core, glob })
