name: pages

# Deploys the site tree the publish workflow assembled to GitHub Pages, which
# is the gateway's library_source.
#
# A separate workflow rather than a job inside publish, for one reason: the
# Pages deployment environment serialises deployments and can queue, and a
# queued deployment inside publish would hold the whole publish run open
# behind it. The blobs and the index reach GHCR whether or not Pages is having
# a good day, and this deploys the moment it can.

on:
  workflow_run:
    workflows: [publish]
    types: [completed]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      # Read the site artifact the publish run uploaded.
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the assembled site from the publish run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
