name: ci

on:
  pull_request:
  push:
    branches: [main]

# The organisation forbids a write default for GITHUB_TOKEN, so every
# workflow here declares exactly what it needs. CI needs to read the tree.
permissions:
  contents: read
  # To pull the pinned build image from this repository's own GHCR package.
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Not self-hosted: this repository is public and has no reason to reach
    # the MCPGW fleet, and the reproducible build happens inside a pinned
    # container anyway, so the host does not enter a digest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # MCPGW is private, so the two contract files are committed under
      # contract/ and bound by the digests in EXECUTOR_TARGET.yaml, which
      # make check verifies offline. When a read token for MCPGW is
      # configured, this step also proves the committed bytes are exactly
      # the bytes the pinned MCPGW build publishes. Without it the step says
      # so and moves on; it never silently passes a comparison it did not
      # make.
      - name: Cross-check the committed contract against the pinned MCPGW build
        env:
          GH_TOKEN: ${{ secrets.MCPGW_CONTRACT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MCPGW_CONTRACT_TOKEN is not set; the committed contract is checked against its recorded digests only"
            exit 0
          fi
          scripts/contract-crosscheck.sh

      - name: make check
        run: make check

      # -count=5 is not superstition: it catches a map-iteration dependency
      # that a single run can pass by luck.
      - name: The tar writer is byte-stable
        run: go test ./internal/pack/... -run TestWrite -count=5

  # Three checks CI can make that a reviewer would otherwise make by eye.
  curation:
    name: curation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: A new server must be recorded in the vetting table
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          new="$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" \
            | sed -nE 's#^servers/([^/]+)/package\.yaml$#\1#p')"
          for name in $new; do
            grep -qE "^\| \`?$name\`? " docs/VETTING.md || {
              echo "servers/$name is new but has no row in docs/VETTING.md" >&2; exit 1; }
          done

      - name: Every recipe carries vetting evidence
        run: |
          set -euo pipefail
          make build
          ./bin/mcplib validate ./servers/...

      # The one that prevents the worst review failure available here: a bump
      # of the window buried inside a server change, where the rebuild of
      # every other package the bump requires never happens.
      - name: The executor target and a server change never travel together
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if grep -qE '^(EXECUTOR_TARGET\.yaml|contract/)' <<<"$files" && grep -q '^servers/' <<<"$files"; then
            echo "EXECUTOR_TARGET.yaml and contract/ move in their own pull request; see docs/CURATION.md" >&2
            exit 1
          fi

  packages:
    name: packages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build mcplib
        run: make build

      # The build image is this repository's own GHCR package; the token can
      # read it whether or not the package is public yet.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The property the repository exists to have, proven per pull request:
      # every touched package builds twice to the same digest.
      - name: Build each touched package twice and compare digests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p dist/a
          changed="$(scripts/touched-servers.sh)"
          if [ -z "$changed" ]; then echo "no servers touched"; exit 0; fi
          for name in $changed; do
            if [ ! -f "servers/$name/package.yaml" ]; then
              echo "servers/$name was removed; nothing to build"
              continue
            fi
            for arch in $(./bin/mcplib arches --server "$name"); do
              ./bin/mcplib build --server "$name" --arch "$arch" --out dist/a
              ./bin/mcplib build --server "$name" --arch "$arch" --out dist/b
              da="$(cut -d' ' -f1 < "dist/a/$name-$arch.tar.gz.sha256")"
              db="$(cut -d' ' -f1 < "dist/b/$name-$arch.tar.gz.sha256")"
              if [ "$da" != "$db" ]; then
                echo "$name/$arch is not reproducible: $da != $db" >&2
                echo "compare with: diffoscope dist/a/$name-$arch.tar.gz dist/b/$name-$arch.tar.gz" >&2
                exit 1
              fi
              echo "$name/$arch reproducible at $da"
            done
          done

      # smoke needs the exact tar this job just built, not a rebuild, so it
      # runs the one thing publishing would sign.
      - name: Upload dist/a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-a
          path: dist/a
          if-no-files-found: ignore

  # The supply-chain evidence a reviewer would otherwise have to gather by
  # hand: OSV lookups, licence classification, install-script detection. Its
  # own required check, so a PR cannot merge past a blocking finding.
  audit:
    name: audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build mcplib
        run: make build

      - name: Audit each touched server
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p dist/audit
          changed="$(scripts/touched-servers.sh)"
          if [ -z "$changed" ]; then
            echo "no servers touched"
            exit 0
          fi
          status=0
          for name in $changed; do
            if [ ! -f "servers/$name/package.yaml" ]; then
              echo "servers/$name was removed; nothing to audit"
              continue
            fi
            ./bin/mcplib audit --server "$name" --json > "dist/audit/$name.json" || status=1
          done
          exit "$status"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-reports
          path: dist/audit
          if-no-files-found: ignore

  # The test deployment: runs the exact tar packages just built, the one
  # publishing would sign, in the locked-down container. Its own required
  # check. The integration tests below gate the harness itself, on every PR,
  # not only one that touches a server.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: packages
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Decided before anything else, because packages uploads dist-a only
      # when it built something: on a PR that touches no server, or only
      # removes one, there is no artifact, and the download below must be
      # skipped rather than fail the required check before its own "no
      # servers touched" success.
      - name: Servers to smoke
        id: touched
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          present=""
          for name in $(scripts/touched-servers.sh); do
            if [ -f "servers/$name/package.yaml" ]; then
              present="$present $name"
            else
              echo "servers/$name was removed; nothing to smoke"
            fi
          done
          present="${present# }"
          [ -n "$present" ] || echo "no servers touched"
          echo "servers=$present" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.touched.outputs.servers != ''
        with:
          name: dist-a
          path: dist/a

      # The build image is this repository's own GHCR package; the token can
      # read it whether or not the package is public yet.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build mcplib
        run: make build

      - name: Smoke each touched server's tar, per arch
        env:
          SERVERS: ${{ steps.touched.outputs.servers }}
        run: |
          set -euo pipefail
          mkdir -p dist/smoke
          if [ -z "$SERVERS" ]; then
            echo "no servers touched"
            exit 0
          fi
          status=0
          for name in $SERVERS; do
            for arch in $(./bin/mcplib arches --server "$name"); do
              ./bin/mcplib smoke --server "$name" \
                --tar "dist/a/$name-$arch.tar.gz" \
                --json > "dist/smoke/$name-$arch.json" || status=1
            done
          done
          exit "$status"

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-reports
          path: dist/smoke
          if-no-files-found: ignore

      # Same extraction pin-check.sh uses, so the pinned image CI smokes
      # against is always the one line in EXECUTOR_TARGET.yaml.
      - name: The pinned build image, for the integration tests
        id: image
        run: |
          set -euo pipefail
          img="$(sed -nE 's/^[[:space:]]*build_image:[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/p' EXECUTOR_TARGET.yaml)"
          echo "image=$img" >> "$GITHUB_OUTPUT"

      # Gates the harness itself — the proxy sidecar, the probe, the
      # snapshot comparison — on every PR, so a bug there does not ship
      # unnoticed on a PR that happens to touch no package.
      - name: Smoke integration tests
        env:
          MCPLIB_SMOKE_IMAGE: ${{ steps.image.outputs.image }}
        run: go test -tags=integration ./internal/smoke/...
