name: ci

on:
  pull_request:
  push:
    branches: [main]

# The organisation forbids a write default for GITHUB_TOKEN, so every
# workflow here declares exactly what it needs. CI needs to read the tree.
permissions:
  contents: read
  # To pull the pinned build image from this repository's own GHCR package.
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # Not self-hosted: this repository is public and has no reason to reach
    # the MCPGW fleet, and the reproducible build happens inside a pinned
    # container anyway, so the host does not enter a digest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # MCPGW is private, so the two contract files are committed under
      # contract/ and bound by the digests in EXECUTOR_TARGET.yaml, which
      # make check verifies offline. When a read token for MCPGW is
      # configured, this step also proves the committed bytes are exactly
      # the bytes the pinned MCPGW build publishes. Without it the step says
      # so and moves on; it never silently passes a comparison it did not
      # make.
      - name: Cross-check the committed contract against the pinned MCPGW build
        env:
          GH_TOKEN: ${{ secrets.MCPGW_CONTRACT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "MCPGW_CONTRACT_TOKEN is not set; the committed contract is checked against its recorded digests only"
            exit 0
          fi
          scripts/contract-crosscheck.sh

      - name: make check
        run: make check

      # -count=5 is not superstition: it catches a map-iteration dependency
      # that a single run can pass by luck.
      - name: The tar writer is byte-stable
        run: go test ./internal/pack/... -run TestWrite -count=5

  packages:
    name: packages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build mcplib
        run: make build

      # The build image is this repository's own GHCR package; the token can
      # read it whether or not the package is public yet.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The property the repository exists to have, proven per pull request:
      # every touched package builds twice to the same digest.
      - name: Build each touched package twice and compare digests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" \
            | sed -nE 's#^servers/([^/]+)/.*#\1#p' | sort -u)"
          if [ -z "$changed" ]; then echo "no servers touched"; exit 0; fi
          for name in $changed; do
            if [ ! -f "servers/$name/package.yaml" ]; then
              echo "servers/$name was removed; nothing to build"
              continue
            fi
            for arch in $(./bin/mcplib arches --server "$name"); do
              ./bin/mcplib build --server "$name" --arch "$arch" --out dist/a
              ./bin/mcplib build --server "$name" --arch "$arch" --out dist/b
              da="$(cut -d' ' -f1 < "dist/a/$name-$arch.tar.gz.sha256")"
              db="$(cut -d' ' -f1 < "dist/b/$name-$arch.tar.gz.sha256")"
              if [ "$da" != "$db" ]; then
                echo "$name/$arch is not reproducible: $da != $db" >&2
                echo "compare with: diffoscope dist/a/$name-$arch.tar.gz dist/b/$name-$arch.tar.gz" >&2
                exit 1
              fi
              echo "$name/$arch reproducible at $da"
            done
          done
