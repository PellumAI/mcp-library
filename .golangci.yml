version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - (io.Closer).Close
        - (*os.File).Close
    gosec:
      excludes:
        # G204: this tool's job is to run the pinned docker, git and cosign
        # CLIs with argv it assembles; every call site builds an argv, never
        # a shell string.
        - G204
        # G304: every path read is a repository or build-output path the
        # caller named.
        - G304
        # G110: decompression is bounded by the pinned upstream archive the
        # recipe names by digest.
        - G110
        # G301, G302, G306: build outputs are published artefacts and are
        # world-readable by design.
        - G301
        - G302
        - G306
        # G122, G703: the walks rewrite files inside a scratch tree this
        # process created and nothing else writes to; pack.Refuse is what
        # guards what a tree may contain.
        - G122
        - G703
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
